# Plugin registry CI.
#
# PR: read-only — no secrets, no pull_request_target (only perms-label.yml has it, and PR code is not
#     executed there), token contents: read, persist-credentials: false.
#     Checks on macOS and Windows: registry tests + scripts/check.sh with the permissions diff against the PR base
#     (and changing plugin files without a new version is an error: a published archive of the same version is not overwritten).
#     Job perms shows the permissions diff in the run summary: scripts/ from the base branch over the PR files as data
#     (check.mjs --perms-only). It does NOT set the "permissions" label and makes no artifacts: for pull_request this
#     file is taken from the PR itself, and a PR from a fork could rewrite the job. The label is set by perms-label.yml
#     (pull_request_target — the version from main, independent of the PR's ci.yml): it computes permission growth
#     itself with main's scripts over the PR files.
# push to main: the same + job sign — build index.json, sign it with the key from the "registry-signing" environment,
#     publish as assets of the "index" release. Runs on main do not cancel each other (otherwise cancelling mid-upload
#     would leave a new index.json with an old signature), sign runs in its own queue without cancellation; archives
#     are uploaded before the index, index.json and the signature last, and after upload they are compared with the built ones.
#
# Actions are pinned to a major-version tag; when the repo is published, the owner pins them by commit SHA.

name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # cancel an unfinished run only for PRs; a push to main waits its turn (sign is not cut off mid-upload)
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Registry tests
        run: env -u NODE_OPTIONS node --test 'test/*.test.mjs'

      - name: Check plugins
        env:
          # base branch name — via env, not substituted into the script
          BASE_REF: ${{ github.event_name == 'pull_request' && github.base_ref || '' }}
        run: |
          if [ -n "$BASE_REF" ]; then
            scripts/check.sh --base "origin/$BASE_REF" --report check-report.json
          else
            scripts/check.sh --report check-report.json
          fi

  perms:
    name: perms (permission growth, no PR code)
    if: github.event_name == 'pull_request'
    needs: []
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Scripts — from the base branch (already reviewed); these are what we execute.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
          persist-credentials: false

      # PR files — data only: nothing is run from here.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: pr
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # Only a summary for the reviewer (GITHUB_STEP_SUMMARY); the label is set by perms-label.yml, which recomputes it itself.
      - name: Permissions diff (base scripts over PR files)
        working-directory: base
        run: env -u NODE_OPTIONS node scripts/check.mjs --perms-only --root ../pr --base-dir . --report ../perms-report.json

  sign:
    name: sign index.json
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: macos-latest
    timeout-minutes: 10
    # The INDEX_SIGNING_KEY secret lives only in this environment (protected: main branch only, reviewer — the owner).
    environment: registry-signing
    # One publication at a time and no cancellation: the next one waits until the previous one finishes uploading the index and signature.
    concurrency:
      group: sign-index
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # The currently published index.json — so that a version already released with a different archive is not overwritten.
      - name: Published catalog
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p published
          if gh release view index >/dev/null 2>&1; then
            gh release download index -p index.json -D published --clobber || echo "no index.json in the release — first publication"
          fi

      - name: Build and sign index.json
        env:
          INDEX_SIGNING_KEY: ${{ secrets.INDEX_SIGNING_KEY }}
        run: env -u NODE_OPTIONS node scripts/build-index.mjs --out dist --flat-archives --sign-key-env INDEX_SIGNING_KEY --published published/index.json

      - name: Publish (release "index")
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view index >/dev/null 2>&1 || gh release create index --title "index" --notes "Agent Hub plugin catalog (built by CI)" --latest=false
          # archives before the index: a new index.json must not reference an archive that is not uploaded yet
          shopt -s nullglob
          archives=(dist/*.tar.gz)
          if (( ${#archives[@]} )); then gh release upload index "${archives[@]}" --clobber; fi
          # index and signature last and back to back; then compare with the built ones (up to three attempts)
          for attempt in 1 2 3; do
            gh release upload index dist/index.json.minisig dist/index.json --clobber || true
            rm -rf verify && mkdir verify
            if gh release download index -p index.json -p index.json.minisig -D verify \
              && cmp -s verify/index.json dist/index.json && cmp -s verify/index.json.minisig dist/index.json.minisig; then
              echo "index.json and signature are published and match the built ones"
              exit 0
            fi
            echo "attempt $attempt: the published index.json/.minisig pair does not match the built one — retrying"
            sleep 5
          done
          echo "::error::index.json and index.json.minisig in the release do not match the built ones — rerun the sign job"
          exit 1
