# The "permissions" label on PRs where a plugin's permissions grew or trusted paths were touched (then a second reviewer is needed).
#
# Trigger — pull_request_target: this file is taken from the default branch, not from the PR, and runs on every PR
# to main by itself, depending on nothing in the PR. (The former workflow_run after ci depended on the PR: for
# pull_request the name "ci" and the triggers come from the PR's own ci.yml, and a PR from a fork that renamed the
# workflow got neither the label for permission growth nor the label for editing .github/.)
#
# pull_request_target gives the token write access, so PR code is NOT executed here in any form: scripts and node
# run from the checkout of the default branch (base/), PR files (pr/) are only data for
# check.mjs --perms-only (metadata is read as text; neither the PR's plugins, nor their tests, nor scripts, nor
# package.json are executed or loaded). No secrets, the token is only pull-requests: write.
#
# The label is also set without permission growth if the PR touches .github/, scripts/, official.json, blocklist.json
# or CODEOWNERS: that is where it is decided what counts as permission growth and who signs the index.

name: perms-label

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: perms-label-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  label:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      # Scripts — from the default branch; these are what we execute.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: base
          persist-credentials: false

      # PR files — data only: nothing is run from here.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: pr
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Label from the permissions diff (main scripts over PR files)
        working-directory: base
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          # if the check fails there is no report, and perms-artifact treats the permissions as grown: an extra label is better than a missed one
          env -u NODE_OPTIONS node scripts/check.mjs --perms-only --root ../pr --base-dir . --report ../perms-report.json || true
          env -u NODE_OPTIONS node scripts/perms-artifact.mjs ../perms-report.json "$PR_NUMBER" ../perms
          grew=$(jq -r '.grew' ../perms/perms.json)
          [[ "$grew" == "true" || "$grew" == "false" ]] || { echo "grew is not a bool"; exit 1; }
          trusted=$(gh api --paginate "repos/$REPO/pulls/$PR_NUMBER/files" --jq '.[].filename' \
            | grep -cE '^(\.github/|scripts/|official\.json$|blocklist\.json$|CODEOWNERS$)' || true)
          echo "permissions grew: $grew; trusted files in PR: $trusted"
          if [[ "$grew" == "true" || "$trusted" != "0" ]]; then
            gh pr edit "$PR_NUMBER" -R "$REPO" --add-label permissions
          else
            gh pr edit "$PR_NUMBER" -R "$REPO" --remove-label permissions || true
          fi
